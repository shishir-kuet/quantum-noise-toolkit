[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-noise-toolkit"
version = "0.1.0"
description = "An open-source Python toolkit for quantum noise characterization, simulation, analysis, and visualization on NISQ quantum devices."
readme = "README.md"
requires-python = ">=3.11"

license = { file = "LICENSE" }

authors = [
    { name = "Md. Mosaddek Ali" }
]

keywords = [
    "quantum",
    "qiskit",
    "noise",
    "nisq",
    "quantum-computing",
    "ibm-quantum"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics"
]

dependencies = [
    "qiskit>=2.4.0",
    "qiskit-aer>=0.17.2",
    "qiskit-ibm-runtime>=0.47.0",
    "qiskit-experiments>=0.14.1",
    "numpy>=2.0",
    "scipy>=1.17",
    "pandas>=3.0",
    "matplotlib>=3.11",
    "plotly>=6.0",
    "rustworkx>=0.17"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]